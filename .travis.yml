sudo: false
dist: trusty
language: java
jdk:
  - oraclejdk8
branches:
  only:
    - master
    - 1.9.x
    - dev
    - FFTF
before_install:
- mkdir -p ~/.m2; wget -q -O ~/.m2/settings.xml https://raw.githubusercontent.com/nbnuk/travis-build-configuration/master/travis_maven_settings.xml
script:
  - "[ \"${TRAVIS_PULL_REQUEST}\" = \"false\" ] && mvn -P travis clean install deploy -DskipTests || mvn -P travis clean install -DskipTests"
env:
  global:
  - secure: 
  - secure: 
